name: Build iPhone IPA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/build-ios.yml
      - OrbitCubeRemote/**
      - OrbitCubeRemote.xcodeproj/**

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15-intel
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Compile and package the unsigned iPhone app
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version
          app_dir="$RUNNER_TEMP/orbit-build"
          xcodebuild -project OrbitCubeRemote.xcodeproj -target OrbitCubeRemote \
            -configuration Release -sdk iphoneos \
            "CONFIGURATION_BUILD_DIR=$app_dir" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build
          app="$app_dir/OrbitCubeRemote.app"
          test -x "$app/OrbitCubeRemote"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Info.plist")" = com.orbitcube.prismremote
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleSupportedPlatforms:0' "$app/Info.plist")" = iPhoneOS
          xcrun lipo -verify_arch arm64 "$app/OrbitCubeRemote"
          xcrun vtool -show-build "$app/OrbitCubeRemote"
          cd "$RUNNER_TEMP"
          mkdir Payload
          cp -R "$app" Payload/
          zip -qry "$GITHUB_WORKSPACE/OrbitCubeRemote.ipa" Payload
          unzip -tq "$GITHUB_WORKSPACE/OrbitCubeRemote.ipa"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: OrbitCubeRemote-iPhone
          path: OrbitCubeRemote.ipa
          if-no-files-found: error
          retention-days: 7
